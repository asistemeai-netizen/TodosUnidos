version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://api:3001/api/v1}
      - NODE_ENV=production
    networks:
      - default
      - dokploy-network
    # El puerto interno del contenedor web (Next standalone expone el 3000 por defecto)
    expose:
      - "3000"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Descomentar si usas la base de datos local (bloque al final del archivo)
    # depends_on:
    #   postgres:
    #     condition: service_started
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SEARXNG_URL=${SEARXNG_URL}
      - SEARXNG_USER=${SEARXNG_USER}
      - SEARXNG_PASSWORD=${SEARXNG_PASSWORD}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - NODE_ENV=production
    networks:
      - default
      - dokploy-network
    # El puerto interno del contenedor api
    expose:
      - "3001"

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
    networks:
      - default
      - dokploy-network
    # El puerto interno del contenedor mcp
    expose:
      - "3002"

networks:
  dokploy-network:
    external: true
  default:
    driver: bridge

